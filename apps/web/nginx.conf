server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/javascript application/json image/svg+xml text/css;

  # Vite fingerprints root-level build assets. Cache those files permanently;
  # public assets in nested folders keep their normal revalidation behavior.
  location ~* ^/assets/[^/]+\.(?:css|js|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /store-api/ { rewrite ^/store-api/(.*)$ /api/$1 break; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /media/ { proxy_pass http://api:8000; }
  location /health { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
