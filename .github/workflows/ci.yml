name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-test-secret-that-is-not-deployed
      COOKIE_SECURE: false
      PAYMENTS_MOCK: true
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: apps/api/requirements.txt }
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest --cov=app
      - run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: pip install -r ../api/requirements.txt
      - run: npm test
      - run: npm run build
      - run: npm run openapi:ci
      - run: git diff --exit-code -- src/generated/api.d.ts
