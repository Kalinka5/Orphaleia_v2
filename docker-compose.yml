services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orphaleia
      POSTGRES_USER: orphaleia
      POSTGRES_PASSWORD: orphaleia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orphaleia -d orphaleia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orphaleia:orphaleia@db:5432/orphaleia}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or run make demo}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-hello@orphaleia.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_PREVIEW_URL: ${MAIL_PREVIEW_URL-http://localhost:8025}
      PAYMENTS_MOCK: ${PAYMENTS_MOCK:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.paypal.com}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers"
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orphaleia:orphaleia@db:5432/orphaleia}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or run make demo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-hello@orphaleia.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    command: python -m app.worker
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    depends_on:
      api:
        condition: service_healthy

  seed:
    profiles: ["demo"]
    build: ./apps/api
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orphaleia:orphaleia@db:5432/orphaleia}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or run make demo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALLOW_DEMO_SEED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@orphaleia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env or run make demo}
    command: sh -c "alembic upgrade head && python -m app.seed"
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_API_URL: http://localhost:${API_PORT:-8010}/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
  media_data:
  web_node_modules:
