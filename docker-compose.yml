services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orphaleia
      POSTGRES_USER: orphaleia
      POSTGRES_PASSWORD: orphaleia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orphaleia -d orphaleia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orphaleia:orphaleia@db:5432/orphaleia}
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret-change-before-deployment}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-hello@orphaleia.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_PREVIEW_URL: ${MAIL_PREVIEW_URL-http://localhost:8025}
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://orphaleia:orphaleia@db:5432/orphaleia}
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret-change-before-deployment}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-hello@orphaleia.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    command: python -m app.worker
    volumes:
      - ./apps/api:/app
      - media_data:/app/media
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_API_URL: http://localhost:${API_PORT:-8010}/api/v1
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  media_data:
  web_node_modules:
